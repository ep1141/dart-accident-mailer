name: DART 중대재해 공시 모니터링

on:
  schedule:
    # 매일 15:00 KST = 06:00 UTC (평일). GitHub cron은 수분~수십분 지연될 수 있음
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 메일 미발송(테스트)"
        default: "0"
      lookback_days:
        description: "조회 기간(일)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: dart-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 공시 확인 및 메일 발송
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          KEYWORDS: ${{ vars.KEYWORDS || '중대재해' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python dart_monitor.py

      - name: 발송 이력 저장
        if: success()
        run: |
          git config user.name "dart-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/sent.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 테스트 미리보기 업로드
        if: github.event.inputs.dry_run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: out/preview.html
          if-no-files-found: ignore
